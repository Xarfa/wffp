<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RattryWu</title>
<meta name="description" content="RattryWu — industrial design, engineered in the open. Current project: wf672, an open-source 3D-printed fountain pen.">
<meta property="og:title" content="RattryWu">
<meta property="og:description" content="Industrial design, engineered in the open. wf672 — an open-source 3D-printed fountain pen.">
<meta property="og:image" content="assets/sec_trans_color.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="wordmark" href="#top">RattryWu</a>
  <nav class="nav">
    <a href="#projects">projects</a>
    <a href="#contact">contact</a>
  </nav>
</header>

<main id="top">

  <!-- ============ PROJECTS ============ -->
  <section class="projects" id="projects">
    <div class="wrap">
      <p class="label">Projects</p>

      <a class="project-bar" href="wf672/">
        <div>
          <span class="project-name">wf672<span class="arrow">→</span></span>
          <p class="project-desc">An open-source 3D-printed fountain pen. One STL, CC BY 4.0.</p>
          <p class="project-meta">2026.10</p>
        </div>
        <figure class="project-plate">
          <img src="assets/sec_trans_color.png" alt="wf672 transverse sections plate" loading="lazy">
        </figure>
      </a>

    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="contact" id="contact">
    <div class="wrap">
      <p class="label">Contact me</p>
      <div class="contact-grid">
        <div>
          <h2>say hello</h2>
          <form action="https://formsubmit.co/rattry4codex@163.com" method="POST">
            <input type="hidden" name="_subject" value="New message from xarfa.github.io/wffp">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <div class="row">
              <label for="f-name">Name</label>
              <input id="f-name" type="text" name="name" autocomplete="name" required>
            </div>
            <div class="row">
              <label for="f-email">Email</label>
              <input id="f-email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="row">
              <label for="f-msg">Message</label>
              <textarea id="f-msg" name="message" rows="5" required></textarea>
            </div>
            <button class="btn" type="submit">Send</button>
          </form>
        </div>
        <div>
          <figure class="contact-photo">
            <img src="assets/contact-me.jpg" alt="The shelf where the pen lives" loading="lazy">
          </figure>
          <div class="contact-links">
            <a href="mailto:rattry4codex@163.com"><span class="k">Email</span>rattry4codex@163.com</a>
            <a href="https://github.com/Xarfa" target="_blank" rel="noopener"><span class="k">GitHub</span>@Xarfa</a>
            <a href="https://www.xiaohongshu.com/user/profile/65b21361000000000e00224f" target="_blank" rel="noopener"><span class="k">RedNote</span>改造我们的学习</a>
          </div>
          <div class="visitors" id="visitors"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <span>© 2026 RattryWu</span>
  <a href="https://github.com/Xarfa" target="_blank" rel="noopener">github.com/Xarfa</a>
</footer>

<script src="assets/visitors.js?v=20261005" defer></script>
</body>
</html>
