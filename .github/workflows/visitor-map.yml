name: visitor-map

on:
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the visitor map
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python .github/scripts/visitor_map.py
      - name: Commit updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.svg
          git diff --staged --quiet || git commit -m "chore: update visitor map"
          git push
